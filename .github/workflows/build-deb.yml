name: build-deb

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build package
        run: ./debian/build-deb.sh

      - name: Inspect package
        run: |
          dpkg-deb --info dist/btrbak_*.deb
          dpkg-deb --contents dist/btrbak_*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btrbak-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: btrbak-deb
          path: artifact

      - name: Create release and upload .deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" artifact/*.deb --clobber
