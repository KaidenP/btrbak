[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "btrbak"
version = "1.0.1"
description = "btrfs snapshot and offsite backup utility"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
btrbak = "btrbak.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["btrbak", "btrbak.remotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
