[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "btrbak"
version = "1.1.0"
description = "btrfs snapshot and offsite backup utility"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=0.4",
]

[project.scripts]
btrbak = "btrbak.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["btrbak", "btrbak.remotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
