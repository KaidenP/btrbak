# Example btrbak auth file.
#
# Copy this file to /etc/btrbak/auth.yaml and make it readable only by root:
#
#   chmod 600 /etc/btrbak/auth.yaml
#
# A profile remote can reference a key here with `auth: <key>`; btrbak merges
# that value into the remote settings.  The `dir` backend only uses `path`, so
# credentials are mostly reserved for other backends; the `gdrive` backend uses
# `auth: <key>` where the value is the absolute path to the OAuth credentials
# file written by `btrbak gdrive authorize`.

# offsite:
#   username: backup
#   password: change-me

# gdrive:
#   /etc/btrbak/gdrive-token.json
